name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dependances CPU
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn matplotlib scipy openpyxl freqtrade==2026.10
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Suite complete (incluant moteur FreqTrade et integrite entrainement)
        run: python -m unittest discover -s tests
